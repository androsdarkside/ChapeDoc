<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChapeDoc - Template & AI Adapter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Quill.js CSS & JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <!-- Export Word -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-to-word@1.3.0/dist/index.js"></script>

    <style>
        .page-container {
            background: #e5e7eb;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }
        .paper-sheet {
            background: white;
            width: 100%;
            max-width: 850px;
            min-height: 900px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            padding: 2.5rem;
            border-top: 5px solid #4f46e5;
        }
        .ql-container.ql-snow {
            border: none !important;
            font-size: 1.05rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-grow: 1;
        }
        .ql-toolbar.ql-snow {
            border: none !important;
            border-bottom: 1px solid #e5e7eb !important;
            background-color: #f9fafb;
            border-radius: 6px 6px 0 0;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center space-x-3">
            <i class="fa-solid fa-file-invoice text-2xl"></i>
            <h1 class="text-2xl font-bold tracking-wide">ChapeDoc</h1>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex flex-col space-y-6 flex-grow">
        
        <!-- Panneau de configuration (Template + Texte brut) -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <h2 class="text-lg font-bold text-gray-900"><i class="fa-solid fa-layer-group text-indigo-600"></i> Choisir un Modèle & Adapter vos données</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">1. Type de Modèle :</label>
                    <select id="docTemplate" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="corporate">🏢 Profil d'Entreprise / Rapport Corporate</option>
                        <option value="academic">🎓 Mémoire / Rapport Académique</option>
                        <option value="modern">⚡ Lettre / Document Moderne</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">2. Collez vos notes ou votre texte brut ici :</label>
                <textarea id="rawText" rows="4" placeholder="Collez ici toutes vos informations en vrac (historique de l'entreprise, produits, mission, équipe, chiffres...)" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

            <button onclick="adaptTextToTemplate()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition flex items-center justify-center space-x-2 shadow-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Générer et structurer selon le template</span>
            </button>
        </div>

        <!-- Zone d'affichage style A4 -->
        <div class="page-container rounded-xl shadow-inner border border-gray-200">
            <div class="paper-sheet flex flex-col">
                <div id="toolbar-container">
                    <span class="ql-formats"><select class="ql-header"><option value="1">Titre 1</option><option value="2">Titre 2</option><option selected>Normal</option></select></span>
                    <span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button></span>
                    <span class="ql-formats"><select class="ql-align"></select></span>
                    <span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span>
                    <span class="ql-formats"><button class="ql-blockquote"></button></span>
                </div>
                
                <div id="editor-container" class="mt-4 flex-grow" style="min-height: 600px;">
                    <h1 style="color: #4f46e5; font-size: 24px; font-weight: bold; border-bottom: 2px solid #4f46e5; padding-bottom: 5px;">Aperçu du Template</h1>
                    <p>Votre texte structuré et mis en page apparaîtra ici après la génération...</p>
                </div>
            </div>
        </div>

        <!-- Actions de fin -->
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <button onclick="quill.setContents([])" class="text-red-500 hover:text-red-700 font-medium px-4 py-2 text-sm">Effacer</button>
            <button onclick="downloadWord()" class="bg-gray-900 hover:bg-black text-white font-medium px-6 py-2.5 rounded-lg text-sm shadow-sm flex items-center space-x-2">
                <i class="fa-solid fa-download"></i>
                <span>Télécharger en .docx</span>
            </button>
        </div>
    </main>

    <script>
        const quill = new Quill('#editor-container', {
            modules: { toolbar: '#toolbar-container' },
            theme: 'snow'
        });

        async function adaptTextToTemplate() {
            const template = document.getElementById('docTemplate').value;
            const rawText = document.getElementById('rawText').value.trim();
            const btn = document.getElementById('generateBtn');

            if (!rawText) {
                alert("Veuillez coller du texte ou des notes dans la zone prévue !");
                return;
            }

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span> Restructuration en cours...</span>`;
            btn.disabled = true;

            try {
                const res =athyroid = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: rawText, 
                        style: template 
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                
                quill.clipboard.dangerouslyPasteHTML(data.text);
            } catch (err) {
                alert("Erreur : " + err.message);
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i><span> Générer et structurer selon le template</span>`;
                btn.disabled = false;
            }
        }

        async function downloadWord() {
            try {
                const delta = quill.getContents();
                const blob = await quillToWord.generateWord(delta, { exportAs: 'blob' });
                saveAs(blob, "ChapeDoc_Professional_Profile.docx");
            } catch (err) {
                alert("Erreur de téléchargement : " + err.message);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChapeDoc - Smart Document Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Quill.js Editor Core and Theme -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Remplacement de quill-to-word par docx.js pour une mise en page Word avancée -->
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    
    <!-- FileSaver and Quill-to-Word for downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-to-word@1.3.0/dist/index.js"></script>

    <style>
        /* Effet visuel "Feuille de papier A4" pour l'éditeur */
        .page-container {
            background: #e5e7eb;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }
        .paper-sheet {
            background: white;
            width: 100%;
            max-width: 800px;
            min-height: 600px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }
        /* Ajustement de Quill pour épouser la feuille */
        .ql-container.ql-snow {
            border: none !important;
            font-size: 1.1rem;
            font-family: ui-sans-serif, system-ui, sans-serif;
            flex-grow: 1;
        }
        .ql-toolbar.ql-snow {
            border: none !important;
            border-bottom: 1px solid #e5e7eb !important;
            background-color: #f9fafb;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-file-lines text-2xl"></i>
                <h1 class="text-2xl font-bold tracking-wide">ChapeDoc</h1>
            </div>
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full font-medium">Pro Word Generator</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex flex-col space-y-6">
        
        <!-- Panneau de contrôle et choix des modèles -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="space-y-1">
                    <h2 class="text-lg font-bold text-gray-900">What should we write?</h2>
                    <p class="text-xs text-gray-500">Choisissez un modèle ou décrivez votre besoin en détail.</p>
                </div>
                
                <!-- Sélecteur de style / template -->
                <div class="flex items-center space-x-2 w-full md:w-auto">
                    <label for="docStyle" class="text-xs font-semibold text-gray-600 whitespace-nowrap"><i class="fa-solid fa-paintbrush text-indigo-600"></i> Style :</label>
                    <select id="docStyle" class="bg-gray-50 border border-gray-300 text-gray-900 text-xs rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2">
                        <option value="professional">💼 Professionnel & Formel</option>
                        <option value="academic">🎓 Académique & Structuré</option>
                        <option value="creative">🎨 Moderne & Épuré</option>
                    </select>
                </div>
            </div>

            <!-- Boutons de raccourcis rapides -->
            <div class="flex flex-wrap gap-2 items-center pt-2 border-t border-gray-100">
                <span class="text-xs font-semibold text-gray-400 mr-2">Modèles rapides :</span>
                <button onclick="setPrompt('Rédige un rapport de stage professionnel avec introduction, problématique, développement et conclusion')" class="text-xs bg-gray-100 hover:bg-indigo-50 hover:text-indigo-700 text-gray-700 font-medium px-3 py-1.5 rounded-lg transition border border-gray-200">Rapport de stage</button>
                <button onclick="setPrompt('Rédige une lettre de motivation percutante pour un poste en entreprise')" class="text-xs bg-gray-100 hover:bg-indigo-50 hover:text-indigo-700 text-gray-700 font-medium px-3 py-1.5 rounded-lg transition border border-gray-200">Lettre de motivation</button>
                <button onclick="setPrompt('Rédige un compte-rendu de réunion professionnel structuré avec ordre du jour et plan d\'action')" class="text-xs bg-gray-100 hover:bg-indigo-50 hover:text-indigo-700 text-gray-700 font-medium px-3 py-1.5 rounded-lg transition border border-gray-200">Compte-rendu</button>
            </div>

            <!-- Barre de saisie du prompt -->
            <div class="flex space-x-3 pt-2">
                <input type="text" id="aiPrompt" placeholder="Ex: Rédige un contrat de prestation de services informatiques..." class="flex-grow px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button onclick="generateWithAI()" id="generateBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition flex items-center space-x-2 shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Generate</span>
                </button>
            </div>
        </div>

        <!-- Zone d'Édition Façon "Page Word / A4" -->
        <div class="page-container rounded-xl shadow-inner border border-gray-200">
            <div class="paper-sheet">
                <!-- Barre d'outils Quill -->
                <div id="toolbar-container">
                    <span class="ql-formats">
                        <select class="ql-header">
                            <option value="1">Titre 1</option>
                            <option value="2">Titre 2</option>
                            <option selected>Normal</option>
                        </select>
                    </span>
                    <span class="ql-formats">
                        <button class="ql-bold"></button>
                        <button class="ql-italic"></button>
                        <button class="ql-underline"></button>
                        <button class="ql-strike"></button>
                    </span>
                    <span class="ql-formats">
                        <select class="ql-align"></select>
                    </span>
                    <span class="ql-formats">
                        <button class="ql-list" value="ordered"></button>
                        <button class="ql-list" value="bullet"></button>
                    </span>
                    <span class="ql-formats">
                        <button class="ql-blockquote"></button>
                    </span>
                    <span class="ql-formats">
                        <button class="ql-clean"></button>
                    </span>
                </div>
                
                <!-- Zone de texte éditable -->
                <div id="editor-container" class="p-6">
                    <p>Votre document généré apparaîtra ici, prêt à être personnalisé...</p>
                </div>
            </div>
        </div>

        <!-- Pied de page avec actions -->
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <button onclick="clearDraft()" class="text-red-500 hover:text-red-700 font-medium px-4 py-2 transition flex items-center space-x-2 text-sm">
                <i class="fa-solid fa-trash-can"></i>
                <span>Start Fresh</span>
            </button>
            
            <button onclick="downloadWord()" class="bg-gray-900 hover:bg-black text-white font-medium px-6 py-2.5 rounded-lg transition flex items-center space-x-2 shadow-sm text-sm">
                <i class="fa-solid fa-download"></i>
                <span>Download as .docx</span>
            </button>
        </div>
    </main>

    <script>
        const quill = new Quill('#editor-container', {
            modules: { toolbar: '#toolbar-container' },
            theme: 'snow'
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedDraft = localStorage.getItem('chapedoc_draft');
            if (savedDraft) {
                quill.setContents(JSON.parse(savedDraft));
            }
        });

        quill.on('text-change', function() {
            const content = quill.getContents();
            localStorage.setItem('chapedoc_draft', JSON.stringify(content));
        });

        function clearDraft() {
            if(confirm("Voulez-vous vraiment effacer le document actuel ?")) {
                quill.setContents([]); 
                localStorage.removeItem('chapedoc_draft'); 
            }
        }

        function setPrompt(text) {
            document.getElementById('aiPrompt').value = text;
        }

        async function generateWithAI() {
            const promptInput = document.getElementById('aiPrompt');
            const btn = document.getElementById('generateBtn');
            const styleSelect = document.getElementById('docStyle');
            
            if (!promptInput || !btn) return;

            const prompt = promptInput.value.trim();
            if (!prompt) {
                alert("Veuillez écrire un sujet avant de cliquer sur Générer !");
                return;
            }

            const selectedStyle = styleSelect ? styleSelect.value : 'professional';

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span> Réflexion...</span>`;
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt,
                        style: selectedStyle 
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Le serveur backend a échoué.");
                }
                
                quill.clipboard.dangerouslyPasteHTML(data.text);
                
            } catch (error) {
                alert("Erreur : " + error.message);
                console.error(error);
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i><span> Generate</span>`;
                btn.disabled = false;
            }
        }

        async function downloadWord() {
            try {
                const delta = quill.getContents();
                const docAsBlob = await quillToWord.generateWord(delta, { exportAs: 'blob' });
                saveAs(docAsBlob, "ChapeDoc_Document.docx");
            } catch (error) {
                alert("Erreur lors du téléchargement : " + error.message);
            }
        }
    </script>
</body>
</html>

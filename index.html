<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChapeDoc - Smart Templates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-to-word@1.3.0/dist/index.js"></script>

    <style>
        .page-container { background: #e5e7eb; padding: 2rem; display: flex; justify-content: center; }
        .paper-sheet { background: white; width: 100%; max-width: 850px; min-height: 900px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 3rem; }
        .ql-container.ql-snow { border: none !important; font-size: 1.1rem; }
        .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid #e5e7eb !important; background: #f9fafb; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
        <h1 class="text-2xl font-bold"><i class="fa-solid fa-file-word"></i> ChapeDoc</h1>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full space-y-6">
        
        <!-- Contrôles -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold">1. Charger le modèle</h2>
                <button onclick="loadTemplateManually()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-sm font-medium transition">
                    Afficher le Company Profile vide
                </button>
            </div>
            
            <hr class="border-gray-200">

            <div>
                <h2 class="font-bold mb-2">2. Laisser l'IA remplir le modèle</h2>
                <textarea id="rawText" rows="3" placeholder="Collez vos notes ici (ex: Nom de l'entreprise, historique, produits...) et l'IA les insérera dans le template." class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 mb-2"></textarea>
                <button onclick="fillTemplateWithAI()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> L'IA remplit le document
                </button>
            </div>
        </div>

        <!-- Éditeur -->
        <div class="page-container rounded-xl shadow-inner border border-gray-200">
            <div class="paper-sheet flex flex-col">
                <div id="toolbar-container">
                    <span class="ql-formats"><select class="ql-header"><option value="1">Titre 1</option><option value="2">Titre 2</option><option selected>Normal</option></select></span>
                    <span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button></span>
                    <span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span>
                </div>
                <div id="editor-container" class="mt-4 flex-grow"><p>Le document apparaîtra ici...</p></div>
            </div>
        </div>

        <div class="flex justify-end p-4">
            <button onclick="downloadWord()" class="bg-gray-900 text-white px-6 py-2 rounded-lg font-medium hover:bg-black"><i class="fa-solid fa-download"></i> Télécharger en .docx</button>
        </div>
    </main>

    <script>
        const quill = new Quill('#editor-container', { modules: { toolbar: '#toolbar-container' }, theme: 'snow' });

        // Voici le stockage de votre document "Company Profile"
        const companyProfileHTML = `
            <div style="text-align: center; border-bottom: 2px solid #4f46e5; padding-bottom: 20px; margin-bottom: 30px;">
                <h1>[Company Name]</h1>
                <p><strong>Company Profile</strong> | 2026</p>
            </div>
            <h2>Introduction</h2>
            <p>[Brief background, founding date, primary activities]</p>
            <h2>Mission and Vision</h2>
            <p><strong>Mission:</strong> [Mission statement]</p>
            <p><strong>Vision:</strong> [Vision statement]</p>
            <h2>Products and Services</h2>
            <ul>
                <li>[Product/Service 1]</li>
                <li>[Product/Service 2]</li>
            </ul>
            <h2>Financial Performance</h2>
            <p>[Revenue and profitability highlights]</p>
            <h2>Contact Information</h2>
            <p><strong>Address:</strong> [Address]</p>
            <p><strong>Email:</strong> [Email]</p>
        `;

        function loadTemplateManually() {
            quill.clipboard.dangerouslyPasteHTML(companyProfileHTML);
        }

        async function fillTemplateWithAI() {
            const rawText = document.getElementById('rawText').value.trim();
            const btn = document.getElementById('generateBtn');
            if (!rawText) return alert("Veuillez coller des informations à insérer !");

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> L'IA travaille...`;
            btn.disabled = true;

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: rawText, templateStructure: companyProfileHTML })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                quill.clipboard.dangerouslyPasteHTML(data.text);
            } catch (err) {
                alert("Erreur : " + err.message);
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> L'IA remplit le document`;
                btn.disabled = false;
            }
        }

        async function downloadWord() {
            const blob = await quillToWord.generateWord(quill.getContents(), { exportAs: 'blob' });
            saveAs(blob, "Company_Profile.docx");
        }
    </script>
</body>
</html>

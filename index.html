<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChapeDoc - Assistant IA de Rédaction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-to-word@1.3.0/dist/index.js"></script>

    <style>
        .page-container { background: #e5e7eb; padding: 2rem; display: flex; justify-content: center; }
        .paper-sheet { background: white; width: 100%; max-width: 850px; min-height: 900px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 3rem; }
        .ql-container.ql-snow { border: none !important; font-size: 1.1rem; }
        .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid #e5e7eb !important; background: #f9fafb; }
        
        /* Animation pour indiquer que l'IA réfléchit */
        .ai-loading { animation: pulse 1.5s infinite; opacity: 0.7; pointer-events: none; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-800">

    <header class="bg-indigo-600 text-white shadow-md py-4 px-8 flex justify-between items-center">
        <h1 class="text-2xl font-black flex items-center space-x-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>ChapeDoc IA</span>
        </h1>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full space-y-6 flex-grow">
        
        <!-- Bloc de génération principale -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <h2 class="font-bold text-gray-800"><i class="fa-solid fa-pen-nib text-indigo-600"></i> Générer un brouillon</h2>
            <div class="flex space-x-2">
                <textarea id="mainPrompt" rows="2" placeholder="De quoi voulez-vous parler ? (Ex: Rédige une introduction pour une entreprise de panneaux solaires...)" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                <button onclick="generateMainContent()" id="mainGenerateBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 rounded-lg transition shadow-sm whitespace-nowrap">
                    Générer
                </button>
            </div>
        </div>

        <!-- LA BAGUETTE MAGIQUE (Actions contextuelles) -->
        <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100 flex flex-wrap gap-2 items-center justify-between">
            <div class="flex items-center space-x-2 text-indigo-800 text-sm font-semibold">
                <i class="fa-solid fa-bolt text-yellow-500"></i>
                <span>Sélectionnez du texte dans l'éditeur, puis :</span>
            </div>
            <div class="flex space-x-2" id="ai-action-buttons">
                <button onclick="modifySelection('reformuler')" class="bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded text-sm font-medium transition shadow-sm">
                    <i class="fa-solid fa-arrows-rotate"></i> Reformuler
                </button>
                <button onclick="modifySelection('rallonger')" class="bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded text-sm font-medium transition shadow-sm">
                    <i class="fa-solid fa-plus"></i> Rallonger
                </button>
                <button onclick="modifySelection('pro')" class="bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded text-sm font-medium transition shadow-sm">
                    <i class="fa-solid fa-briefcase"></i> Rendre Pro
                </button>
                <button onclick="modifySelection('resumer')" class="bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded text-sm font-medium transition shadow-sm">
                    <i class="fa-solid fa-compress"></i> Résumer
                </button>
            </div>
        </div>

        <!-- Éditeur A4 -->
        <div class="page-container rounded-xl shadow-inner border border-gray-200">
            <div class="paper-sheet flex flex-col" id="paper-wrapper">
                <div id="toolbar-container">
                    <span class="ql-formats"><select class="ql-header"><option value="1">Titre 1</option><option value="2">Titre 2</option><option selected>Normal</option></select></span>
                    <span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button></span>
                    <span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span>
                </div>
                <div id="editor-container" class="mt-4 flex-grow"><p>Commencez à écrire ou générez un texte...</p></div>
            </div>
        </div>

        <!-- Export -->
        <div class="flex justify-between p-4 bg-white rounded-xl border border-gray-200 shadow-sm">
            <button onclick="quill.setContents([])" class="text-red-500 font-medium px-4 text-sm hover:underline">Vider l'éditeur</button>
            <button onclick="downloadWord()" class="bg-gray-900 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-black transition"><i class="fa-solid fa-download"></i> Télécharger en .docx</button>
        </div>
    </main>

    <script>
        const quill = new Quill('#editor-container', { modules: { toolbar: '#toolbar-container' }, theme: 'snow' });

        // 1. Fonction pour la génération principale (créer de zéro)
        async function generateMainContent() {
            const prompt = document.getElementById('mainPrompt').value.trim();
            const btn = document.getElementById('mainGenerateBtn');
            if (!prompt) return alert("Veuillez donner un sujet !");

            btn.innerText = "Génération..."; btn.disabled = true;

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, actionType: 'main' })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                
                quill.clipboard.dangerouslyPasteHTML(data.text);
            } catch (err) {
                alert("Erreur : " + err.message);
            } finally {
                btn.innerText = "Générer"; btn.disabled = false;
            }
        }

        // 2. Fonction pour la BAGUETTE MAGIQUE (Édition de sélection)
        async function modifySelection(action) {
            const range = quill.getSelection();
            
            // Vérifier si du texte est sélectionné
            if (!range || range.length === 0) {
                alert("Veuillez d'abord surligner/sélectionner le texte que vous voulez modifier dans l'éditeur !");
                return;
            }

            const selectedText = quill.getText(range.index, range.length);
            const buttonContainer = document.getElementById('ai-action-buttons');
            
            // Effet visuel pendant que l'IA réfléchit
            buttonContainer.classList.add('ai-loading');

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: selectedText, 
                        actionType: action 
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                
                // Supprimer l'ancien texte et insérer le nouveau généré par l'IA
                quill.deleteText(range.index, range.length);
                quill.clipboard.dangerouslyPasteHTML(range.index, data.text);
                
            } catch (err) {
                alert("Erreur lors de la modification : " + err.message);
            } finally {
                buttonContainer.classList.remove('ai-loading');
            }
        }

        async function downloadWord() {
            const blob = await quillToWord.generateWord(quill.getContents(), { exportAs: 'blob' });
            saveAs(blob, "ChapeDoc_Intelligence.docx");
        }
    </script>
</body>
</html>

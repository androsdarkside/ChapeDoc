
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChapeDoc - Smart Document Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Quill.js Editor Core and Theme -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <!-- FileSaver and Quill-to-Word for downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Note: We are using a bundle for quill-to-word -->
    <script src="https://cdn.jsdelivr.net/npm/quill-to-word@1.3.0/dist/index.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-file-lines text-2xl"></i>
                <h1 class="text-2xl font-bold tracking-wide">ChapeDoc</h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-8 w-full flex flex-col space-y-6">
        
        <!-- Prompt Generator Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="text-lg font-bold text-gray-900">What should we write?</h2>
            <div class="flex space-x-3">
                <input type="text" id="aiPrompt" placeholder="e.g., Write a formal resignation letter as a software engineer..." class="flex-grow px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button onclick="generateWithAI()" id="generateBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg transition flex items-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Generate</span>
                </button>
            </div>
        </div>

        <!-- Interactive Editor Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col flex-grow">
            <!-- Quill Toolbar container -->
            <div id="toolbar-container" class="border-b border-gray-200 bg-gray-50 rounded-t-xl">
                <span class="ql-formats">
                    <select class="ql-header">
                        <option value="1">Heading</option>
                        <option value="2">Subheading</option>
                        <option selected>Normal</option>
                    </select>
                </span>
                <span class="ql-formats">
                    <button class="ql-bold"></button>
                    <button class="ql-italic"></button>
                    <button class="ql-underline"></button>
                </span>
                <span class="ql-formats">
                    <button class="ql-list" value="ordered"></button>
                    <button class="ql-list" value="bullet"></button>
                </span>
            </div>
            
            <!-- Quill Editor Canvas -->
            <div id="editor-container" class="h-96 text-base font-sans">
                <!-- AI content will stream here -->
                <p>Your generated document will appear here for you to edit...</p>
            </div>
            
            <!-- Export Footer -->
            <div class="p-4 border-t border-gray-200 flex justify-between bg-gray-50 rounded-b-xl">
                <!-- New Clear Button -->
                <button onclick="clearDraft()" class="text-red-500 hover:text-red-700 font-medium px-4 py-2 transition flex items-center space-x-2">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Start Fresh</span>
                </button>
                
                <!-- Existing Download Button -->
                <button onclick="downloadWord()" class="bg-gray-800 hover:bg-gray-900 text-white font-medium px-6 py-2.5 rounded-lg transition flex items-center space-x-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Download as .docx</span>
                </button>
            </div>
        </div>
    </main>

    <script>
       // 1. Initialisation de l'éditeur Quill (Une seule fois !)
        const quill = new Quill('#editor-container', {
            modules: { toolbar: '#toolbar-container' },
            theme: 'snow'
        });

        // 2. Sauvegarde automatique (Auto-Save)
        window.addEventListener('DOMContentLoaded', () => {
            const savedDraft = localStorage.getItem('chapedoc_draft');
            if (savedDraft) {
                quill.setContents(JSON.parse(savedDraft));
            }
        });

        quill.on('text-change', function() {
            const content = quill.getContents();
            localStorage.setItem('chapedoc_draft', JSON.stringify(content));
        });

        function clearDraft() {
            if(confirm("Voulez-vous vraiment effacer le document actuel ?")) {
                quill.setContents([]); 
                localStorage.removeItem('chapedoc_draft'); 
            }
        }

        // 3. Appel à l'Intelligence Artificielle (API Vercel)
        async function generateWithAI() {
            const promptInput = document.getElementById('aiPrompt');
            const btn = document.getElementById('generateBtn');
            
            if (!promptInput || !btn) return;

            const prompt = promptInput.value.trim();
            if (!prompt) {
                alert("Veuillez écrire un sujet avant de cliquer sur Générer !");
                return;
            }

            // Désactiver le bouton pendant le chargement
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span> Réflexion...</span>`;
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Le serveur backend a échoué.");
                }
                
                // Injecter le texte dans l'éditeur
                quill.clipboard.dangerouslyPasteHTML(data.text);
                
            } catch (error) {
                alert("Erreur : " + error.message);
                console.error(error);
            } finally {
                // Réactiver le bouton
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i><span> Generate</span>`;
                btn.disabled = false;
            }
        }

        // 4. Conversion et Téléchargement en Word (.docx)
        async function downloadWord() {
            try {
                // Récupérer le contenu avec le formatage (gras, titres, etc.)
                const delta = quill.getContents();
                
                // Convertir en document Word
                const docAsBlob = await quillToWord.generateWord(delta, { exportAs: 'blob' });
                
                // Télécharger sur l'ordinateur
                saveAs(docAsBlob, "ChapeDoc_Document.docx");
            } catch (error) {
                alert("Erreur lors du téléchargement : " + error.message);
            }
        }
    </script>
</body>
</html>
